# Configuração do git-cliff: gera o CHANGELOG.md a partir das mensagens de commit.
# Rodar localmente: npm run changelog
# Na main, o GitHub Actions roda isso sozinho a cada push (.github/workflows/changelog.yml).

[changelog]
header = """
# Changelog

Todas as mudanças do projeto, geradas automaticamente a partir dos commits.
As mensagens seguem o padrão Conventional Commits (feat, fix, style, docs, chore...).

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%d/%m/%Y") }})
{% else %}\
## Em desenvolvimento
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/GabriellaCMaciel/trama-sustentavel/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"
commit_parsers = [
  { message = "^docs: update changelog", skip = true },
  { message = "^feat", group = "<!-- 0 -->Funcionalidades" },
  { message = "^fix", group = "<!-- 1 -->Correções" },
  { message = "^style", group = "<!-- 2 -->Visual" },
  { message = "^refactor", group = "<!-- 3 -->Refatoração" },
  { message = "^perf", group = "<!-- 4 -->Desempenho" },
  { message = "^docs", group = "<!-- 5 -->Documentação" },
  { message = "^test", group = "<!-- 6 -->Testes" },
  { message = "^(build|ci)", group = "<!-- 7 -->Build e automação" },
  { message = "^chore", group = "<!-- 8 -->Manutenção" },
]
